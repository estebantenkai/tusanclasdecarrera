<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anclas de Carrera · Tenkai Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   TENKAI · Plan de Acción a 12 Meses
   Sistema de diseño: Manual de Marca 2026 (Zona 2 · proceso activo)
   ══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --i:#3b35a8;--deep:#2d2894;--mag:#8b3a8f;--coral:#d4522a;
  --bg:#f0eff5;--ink:#1a1a2e;--sub:#555566;--muted:#888899;
  --border:#e2e0ea;--cream:#ece9f4;--white:#ffffff;
  --grad:linear-gradient(135deg,#3b35a8 0%,#8b3a8f 50%,#d4522a 100%);
  --grad-h:linear-gradient(90deg,#3b35a8 0%,#d4522a 100%);
  --f:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--f);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
button{font-family:var(--f)}
.hidden{display:none!important}

/* ── HEADER (blanco, sticky) ───────────────────────────── */
.hdr{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--border)}
.hdr-in{max-width:900px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.hdr-left{display:flex;align-items:center;gap:12px}
.hdr-left img{width:42px;height:42px;border-radius:9px;display:block}
.hdr-brand{font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1}
.hdr-sub{font-size:9px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.prog-wrap{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:600;color:var(--muted)}
.prog-bar{width:110px;height:5px;border-radius:3px;background:var(--border);overflow:hidden}
.prog-fill{height:100%;background:var(--i);border-radius:3px;transition:width .4s ease}

/* ── PÁGINAS Y HERO ────────────────────────────────────── */
.page{display:none}
.page.on{display:block}
.wrap{max-width:780px;margin:0 auto;padding:0 24px}
.hero{background:var(--i);color:#fff;padding:46px 0 40px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08) 0%,transparent 66%);pointer-events:none}
.hero-ink{background:var(--ink)}
.hero .wrap{position:relative;z-index:2}
.sup{font-size:9.5px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--i)}
.hero .sup{color:rgba(255,255,255,.5);margin-bottom:12px}
.hero-thin{display:block;font-size:22px;font-weight:300;color:rgba(255,255,255,.78);letter-spacing:-.2px;line-height:1.2}
.hero-bold{display:block;font-size:clamp(28px,5.2vw,38px);font-weight:800;letter-spacing:-.5px;color:#fff;line-height:1.1;margin-top:2px}
.hero-bold.grad-text{max-width:100%;word-break:break-word}
.grad-text{background:var(--grad-h);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sec{padding:34px 0 56px}

/* ── STEPPER ───────────────────────────────────────────── */
.stepper{display:flex;align-items:center;justify-content:center;margin-bottom:30px}
.step-node{display:flex;flex-direction:column;align-items:center;gap:5px}
.step-circle{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:#fff;color:var(--muted);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .25s}
.step-circle.active{border-color:var(--i);color:var(--i);box-shadow:0 0 0 4px rgba(59,53,168,.12)}
.step-circle.done{background:var(--i);border-color:var(--i);color:#fff}
.step-lbl{font-size:9.5px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.step-lbl.active{color:var(--i);font-weight:700}
.step-line{width:clamp(18px,7vw,52px);height:2px;background:var(--border);margin:0 4px 16px}
.step-line.done{background:var(--i)}

/* ── TEXTOS Y FORMULARIOS ──────────────────────────────── */
.sec-title{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.15;color:var(--ink);margin:4px 0 8px}
.sec-desc{font-size:14.5px;line-height:1.7;color:var(--sub);max-width:640px;margin-bottom:26px}
.lbl{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.q{font-size:16px;font-weight:700;letter-spacing:-.2px;color:var(--ink);margin-bottom:6px}
.help{font-size:13px;color:var(--sub);line-height:1.65;margin-bottom:12px;max-width:620px}
.intro-p{font-size:15px;line-height:1.8;color:var(--sub);margin-bottom:16px;max-width:640px}
.intro-p strong{color:var(--ink)}
input[type=text],input[type=email],select,textarea{font-family:var(--f);width:100%;padding:11px 15px;border:1.5px solid var(--border);border-radius:8px;font-size:14.5px;color:var(--ink);background:#fff;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--i);box-shadow:0 0 0 3px rgba(59,53,168,.1)}
textarea{resize:vertical;line-height:1.6;min-height:84px}
.field{margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.count{font-size:10.5px;color:var(--muted);text-align:right;margin-top:4px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:22px 24px;box-shadow:0 2px 10px rgba(59,53,168,.07);margin-bottom:18px}
.card-accent{background:#fff;border:1px solid var(--border);border-left:4px solid var(--coral);border-radius:0 14px 14px 0;padding:22px 24px;box-shadow:0 2px 10px rgba(59,53,168,.07);margin-bottom:22px}
.hint-bar{display:flex;gap:10px;align-items:flex-start;background:var(--cream);border-radius:12px;padding:14px 18px;font-size:13px;color:var(--sub);line-height:1.6;margin-bottom:24px}
.note{font-size:12px;color:var(--muted);line-height:1.65}

/* ── BOTONES ───────────────────────────────────────────── */
.btn-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 26px;background:var(--i);color:#fff;border:none;border-radius:24px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.btn:hover{background:var(--deep);transform:translateY(-1px)}
.btn:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;transform:none}
.btn-outline{display:inline-flex;align-items:center;gap:8px;padding:11px 24px;background:transparent;color:var(--i);border:2px solid var(--i);border-radius:24px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-outline:hover{background:var(--i);color:#fff}
.btn-outline:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.btn-ghost:hover{color:var(--ink);border-color:var(--ink)}

/* ── DISCLAIMER IA ─────────────────────────────────────── */
.disc-title{font-size:18px;font-weight:800;letter-spacing:-.3px;color:var(--ink);margin:6px 0 10px;line-height:1.25}
.disc-p{font-size:14px;line-height:1.75;color:var(--sub);margin-bottom:14px}
.disc-list{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.disc-item{display:flex;gap:12px;align-items:flex-start}
.disc-num{flex:0 0 24px;width:24px;height:24px;border-radius:50%;background:var(--i);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.disc-item p{font-size:13.5px;line-height:1.65;color:var(--sub)}
.disc-item strong{color:var(--ink)}
.check{display:flex;gap:11px;align-items:flex-start;cursor:pointer;background:var(--cream);border-radius:10px;padding:13px 16px;font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.5}
.check input{margin-top:3px;width:17px;height:17px;accent-color:var(--i);flex:0 0 auto}

/* ── CHIPS (selección) ─────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:9px 16px;border-radius:24px;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;transition:all .15s;user-select:none}
.chip:hover{border-color:var(--i);color:var(--i)}
.chip.sel-a{background:var(--i);border-color:var(--i);color:#fff}
.chip.sel-b{background:var(--grad-h);border-color:transparent;color:#fff}
.custom-chip{display:flex;gap:10px;align-items:center;max-width:380px;margin-bottom:6px}
.custom-chip input{flex:1}

/* ── SMART ─────────────────────────────────────────────── */
.smart-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:26px}
.smart-card{background:#fff;border:1px solid var(--border);border-top:3px solid var(--i);border-radius:12px;padding:14px 12px}
.smart-letter{font-size:26px;font-weight:900;color:var(--i);line-height:1;letter-spacing:-.5px}
.smart-name{font-size:11.5px;font-weight:700;color:var(--ink);margin:6px 0 3px}
.smart-q{font-size:11px;color:var(--muted);line-height:1.5}

/* ── RUTA DE TRABAJO CON IA ────────────────────────────── */
.route{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:22px}
.route-s{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 12px 14px}
.route-s.you{background:var(--i);border-color:var(--i);color:#fff}
.route-n{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.route-s.you .route-n{color:rgba(255,255,255,.6)}
.route-t{font-size:12.5px;font-weight:700;line-height:1.35;color:var(--ink)}
.route-s.you .route-t{color:#fff}
.route-w{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.route-s.you .route-w{color:rgba(255,255,255,.7)}

/* ── BLOQUES DE IA (fondo ink) ─────────────────────────── */
.ia{background:var(--ink);border-radius:16px;padding:26px 28px;margin-bottom:18px;position:relative;overflow:hidden;color:#fff}
.ia::before{content:"";position:absolute;top:-60px;right:-40px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(59,53,168,.35) 0%,transparent 68%);pointer-events:none}
.ia>*{position:relative;z-index:2}
.ia-eye{font-size:9.5px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:8px}
.ia-title{font-size:19px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px}
.ia-desc{font-size:13px;line-height:1.7;color:rgba(255,255,255,.65);margin-bottom:14px;max-width:600px}
.ia-prompt{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:13px 16px;font-size:12.5px;font-style:italic;color:rgba(255,255,255,.8);line-height:1.7;margin-bottom:14px}
.ia-prompt strong{display:block;font-style:normal;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:5px}
.btn-ia{display:inline-flex;align-items:center;gap:8px;padding:9px 20px;background:#fff;color:var(--i);border:none;border-radius:20px;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .2s}
.btn-ia:hover{transform:translateY(-1px)}
.btn-ia.copied{background:rgba(255,255,255,.15);color:#fff}
.ia-tip{margin-top:14px;font-size:12px;line-height:1.65;color:rgba(255,255,255,.6);border-top:1px solid rgba(255,255,255,.12);padding-top:12px}

/* ── REVISIÓN (tu turno) ───────────────────────────────── */
.rev{background:#fff;border:2px solid var(--i);border-radius:16px;margin-bottom:22px;overflow:hidden}
.rev-head{background:var(--i);color:#fff;padding:20px 26px}
.rev-head .ia-eye{color:rgba(255,255,255,.55)}
.rev-head h3{font-size:19px;font-weight:800;letter-spacing:-.3px;margin-bottom:5px}
.rev-head p{font-size:13px;line-height:1.65;color:rgba(255,255,255,.75);max-width:600px}
.rev-body{padding:22px 26px 26px}
.rev-qs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.rev-q{background:var(--cream);border-radius:10px;padding:11px 13px;font-size:12px;line-height:1.5;color:var(--sub)}
.rev-q strong{display:block;color:var(--i);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:3px}
.idea{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.idea.dec-sirve{border-left:4px solid var(--i)}
.idea.dec-edito{border-left:4px solid var(--coral)}
.idea.dec-descarto{background:#fafafc;opacity:.85}
.idea-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.idea-n{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--i)}
.seg{display:inline-flex;border:1.5px solid var(--border);border-radius:20px;overflow:hidden;background:#fff}
.seg button{padding:6px 13px;border:none;background:transparent;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--i);color:#fff}
.seg button.on.warm{background:var(--coral)}
.seg button.on.neutral{background:var(--muted)}
.idea textarea{min-height:60px;font-size:13.5px}
.idea textarea+textarea{margin-top:8px}
.rev-sum{font-size:12px;font-weight:600;color:var(--sub);margin:4px 0 18px}
.noia{display:flex;gap:9px;align-items:center;font-size:12.5px;color:var(--sub);margin-bottom:16px;cursor:pointer}
.noia input{width:16px;height:16px;accent-color:var(--i)}

/* ── OBJETIVO: VISTA PREVIA ────────────────────────────── */
.obj-prev{background:var(--ink);border-radius:14px;padding:22px 26px;margin:14px 0 4px;max-width:700px}
.obj-prev-l{font-size:9.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:8px}
.obj-prev-t{font-size:17px;font-weight:700;line-height:1.5;color:#fff;letter-spacing:-.2px}
.obj-prev-e{font-size:13px;color:rgba(255,255,255,.35);font-style:italic}

/* ── TRIMESTRES ────────────────────────────────────────── */
.qc{background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px 22px 22px;margin-bottom:16px;box-shadow:0 2px 10px rgba(59,53,168,.07)}
.qc-top{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.qc-n{width:34px;height:34px;border-radius:50%;background:var(--i);color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.qc-per{font-size:15px;font-weight:800;letter-spacing:-.2px;color:var(--ink)}
.qc-tag{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--i);background:var(--cream);border-radius:12px;padding:4px 11px}
.qc-hint{font-size:12.5px;color:var(--sub);line-height:1.6;background:var(--bg);border-left:3px solid var(--i);border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:14px}
.a-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.a-num{flex:0 0 24px;width:24px;height:24px;border-radius:50%;background:var(--cream);color:var(--i);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.month-card{max-width:480px}
.checklist{font-size:12.5px;color:var(--sub);line-height:1.7;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.65)}

/* ── REUNIONES ─────────────────────────────────────────── */
.rit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.rit{background:#fff;border:1px solid var(--border);border-top:4px solid var(--i);border-radius:14px;padding:18px 18px 20px;box-shadow:0 2px 10px rgba(59,53,168,.07)}
.rit.coral{border-top-color:var(--coral)}
.rit-title{font-size:15px;font-weight:800;letter-spacing:-.2px;color:var(--ink);margin-bottom:4px}
.rit-fixed{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:var(--bg);border-radius:10px;padding:3px 9px;margin-bottom:8px}
.rit-desc{font-size:12.5px;line-height:1.6;color:var(--sub);margin-bottom:13px;min-height:78px}
.rit input[type=text]{margin-bottom:8px;font-size:13px;padding:9px 12px}
.rit .seg{margin-bottom:12px}

/* ── PLAN FINAL ────────────────────────────────────────── */
.done-card{background:#fff;border:1px solid var(--border);border-left:4px solid var(--coral);border-radius:0 14px 14px 0;padding:22px 26px;box-shadow:0 2px 10px rgba(59,53,168,.07);margin-bottom:22px}
.done-card h3{font-size:21px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px}
.done-card p{font-size:14px;line-height:1.75;color:var(--sub)}
.actions{display:flex;flex-direction:column;align-items:center;gap:12px;margin:8px 0 10px}
.actions-row{display:flex;gap:11px;flex-wrap:wrap;justify-content:center}
.status{width:100%;max-width:560px;border-radius:12px;padding:14px 18px;font-size:13.5px;line-height:1.65;text-align:center}
.status.ok{background:var(--cream);color:var(--ink)}
.status.err{background:#fff;border:1.5px solid var(--coral);color:var(--ink)}
.status.busy{background:var(--cream);color:var(--sub)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--border);border-top-color:var(--i);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.pv-title{font-size:9.5px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);text-align:center;margin:26px 0 14px}
#pdfPreview{display:flex;flex-direction:column;align-items:center;gap:18px}
#pdfPreview .pdf-page{box-shadow:0 6px 28px rgba(59,53,168,.16);flex:0 0 auto}
#pdfSource{position:fixed;left:-10000px;top:0;width:794px;pointer-events:none}


/* ── VOLVER A INICIAR (al pie de la vista previa) ──────── */
.restart{display:flex;flex-direction:column;align-items:center;gap:14px;margin:34px 0 0;padding-top:26px;border-top:1px solid var(--border)}
.restart-confirm{max-width:480px;text-align:center;background:#fff;border:1.5px solid var(--coral);border-radius:14px;padding:18px 22px}
.restart-confirm p{font-size:13.5px;line-height:1.65;color:var(--sub);margin-bottom:14px}
.restart-confirm strong{color:var(--ink)}
.restart-confirm .actions-row{justify-content:center}

/* ── FOOTER (gradiente, base Zona 2) ───────────────────── */
.tk-footer{background:var(--grad);padding:38px 24px 30px;text-align:center}
.tk-footer-in{max-width:700px;margin:0 auto}
.tk-footer img{height:44px;width:auto;display:block;margin:0 auto 10px}
.tk-tag{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:18px}
.tk-links{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 18px}
.tk-links a{font-size:11.5px;font-weight:600;color:rgba(255,255,255,.78);text-decoration:none;white-space:nowrap}
.tk-links a:hover{color:#fff}
.tk-copy{font-size:9.5px;letter-spacing:.14em;color:rgba(255,255,255,.4);margin-top:18px}

/* ── TOAST ─────────────────────────────────────────────── */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 22px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:200;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ══════════════════════════════════════════════════════════
   PÁGINAS DEL PDF · A4 vertical (794 x 1123 px a 96 dpi)
   ══════════════════════════════════════════════════════════ */
.pdf-page{width:794px;height:1123px;background:#fff;position:relative;overflow:hidden;font-family:var(--f);color:#1a1a2e;line-height:1.5}
.pp-head{background:linear-gradient(135deg,#3b35a8 0%,#8b3a8f 50%,#d4522a 100%);position:relative;overflow:hidden;color:#fff;padding:44px 60px 0}
.pp-head.big{height:268px}
.pp-head.small{height:112px;padding-top:30px}
.pp-corner{position:absolute;right:0;bottom:0;width:250px;height:170px}
.pp-brandrow{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.pp-brandrow img{height:34px;width:auto;display:block}
.pp-brandrow span{font-size:9px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.pp-title{position:relative;z-index:2;font-size:34px;font-weight:800;letter-spacing:-.8px;line-height:1.1;margin-top:46px}
.pp-head.small .pp-title{font-size:22px;margin-top:20px;letter-spacing:-.4px}
.pp-who{position:relative;z-index:2;font-size:16px;font-weight:600;margin-top:14px;color:rgba(255,255,255,.92)}
.pp-meta{position:relative;z-index:2;font-size:10.5px;color:rgba(255,255,255,.62);margin-top:5px;letter-spacing:.02em}
.pp-body{padding:30px 60px 0}
.pp-lbl{font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#888899;margin:0 0 14px;padding-bottom:9px;border-bottom:1px solid #e2e0ea}
.pp-sec{margin-bottom:30px}
.pp-text{font-size:13px;line-height:1.8;color:#555566}
.pp-pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pp-pill{padding:7px 15px;border-radius:20px;font-size:11.5px;font-weight:700;color:#fff}
.pp-obj{background:#f0eff5;border-left:4px solid #d4522a;border-radius:0 12px 12px 0;padding:24px 28px;font-size:17px;font-weight:700;line-height:1.55;color:#1a1a2e;letter-spacing:-.2px}
.pp-glance{display:flex;gap:10px}
.pp-g{flex:1;border:1px solid #e2e0ea;border-top:3px solid #3b35a8;border-radius:10px;padding:14px 13px 16px;min-height:140px}
.pp-g-n{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#3b35a8}
.pp-g-p{font-size:10px;color:#888899;margin:2px 0 7px}
.pp-g-f{font-size:12.5px;font-weight:700;line-height:1.4;color:#1a1a2e}
.pp-q{display:flex;gap:16px;border:1px solid #e2e0ea;border-radius:12px;padding:14px 18px 12px;margin-bottom:12px}
.pp-qn{flex:0 0 30px;width:30px;height:30px;border-radius:50%;background:#3b35a8;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.pp-qb{flex:1;min-width:0}
.pp-qh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px}
.pp-qp{font-size:13px;font-weight:800;color:#1a1a2e}
.pp-qt{font-size:8.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#3b35a8;background:#ece9f4;border-radius:10px;padding:3px 10px}
.pp-qf{font-size:12.5px;font-weight:700;line-height:1.4;color:#3b35a8;margin-bottom:7px}
.pp-act{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;line-height:1.5;color:#555566;margin-bottom:4px}
.pp-act i{flex:0 0 17px;width:17px;height:17px;border-radius:50%;background:#ece9f4;color:#3b35a8;font-style:normal;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px}
.pp-empty{font-size:11px;color:#b5b3c2;font-style:italic}
.pp-rit{display:flex;gap:12px;margin-bottom:14px}
.pp-r{flex:1;border:1px solid #e2e0ea;border-top:4px solid #3b35a8;border-radius:10px;padding:14px 14px 12px}
.pp-r.c{border-top-color:#d4522a}
.pp-r-t{font-size:13px;font-weight:800;color:#1a1a2e}
.pp-r-s{font-size:8.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#888899;margin:2px 0 9px}
.pp-r-k{font-size:8.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#888899;margin-top:7px}
.pp-r-v{font-size:11.5px;font-weight:600;color:#1a1a2e;line-height:1.4}
.pp-note{background:#f0eff5;border-radius:12px;padding:16px 20px;font-size:12px;line-height:1.7;color:#555566}
.pp-note strong{color:#1a1a2e}
.pp-foot{position:absolute;left:0;right:0;bottom:0;height:100px;background:#1a1a2e;padding:20px 60px 0}
.pp-foot-top{display:flex;align-items:center;justify-content:space-between}
.pp-foot-l{display:flex;align-items:center;gap:10px}
.pp-foot-l img{height:22px;width:auto;display:block}
.pp-foot-l span{font-size:8.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.pp-pg{font-size:9px;color:rgba(255,255,255,.4)}
.pp-foot-b{border-top:1px solid rgba(255,255,255,.12);margin-top:11px;padding-top:9px;font-size:9px;line-height:1.8;color:rgba(255,255,255,.58)}
.pp-foot-b div+div{color:rgba(255,255,255,.4)}

/* ── RESPONSIVE ────────────────────────────────────────── */
@media(max-width:680px){
  .grid2,.rit-grid,.rev-qs{grid-template-columns:1fr}

  .route{grid-template-columns:1fr}
  .prog-bar{width:70px}
  .ia,.rev-body,.rev-head{padding-left:20px;padding-right:20px}
  .rit-desc{min-height:0}
}

/* ── IMPRESIÓN (PDF limpio, A4 vertical) ───────────────── */
@page{size:A4 portrait;margin:0}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{background:#fff!important}
  .hdr,.tk-footer,.toast,.no-print,#pdfSource{display:none!important}
  .page{display:none!important}
  #pgPlan.on{display:block!important}
  #pgPlan .wrap{max-width:none;padding:0}
  #pgPlan .sec{padding:0}
  #pdfPreview{display:block!important;zoom:1!important}
  #pdfPreview .pdf-page{box-shadow:none!important;margin:0!important;page-break-after:always;break-after:page}
}


/* ══════════════════════════════════════════════════════════════
   ANCLAS DE CARRERA · estilos propios (Manual de Marca 2026 · Zona 2)
   Evaluación: header indigo sólido, secciones blancas, resultado en ink.
   ══════════════════════════════════════════════════════════════ */
.chips-info{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px}
.info-pill{background:#fff;border:1px solid var(--border);border-radius:24px;padding:8px 16px;font-size:12.5px;font-weight:600;color:var(--sub)}
.info-pill strong{color:var(--i);font-weight:800}
.resume{background:#fff;border:1.5px solid var(--i);border-radius:14px;padding:18px 22px;margin-bottom:22px}
.resume h3{font-size:16px;font-weight:800;letter-spacing:-.2px;margin-bottom:4px}
.resume p{font-size:13.5px;color:var(--sub);line-height:1.6;margin-bottom:12px}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 24px}
.step3{background:#fff;border:1px solid var(--border);border-top:3px solid var(--i);border-radius:12px;padding:14px 14px 16px}
.step3-n{font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--i);margin-bottom:5px}
.step3-t{font-size:13px;font-weight:700;line-height:1.4;color:var(--ink)}

/* Pregunta */
.q-scr{max-width:720px;margin:0 auto;padding:30px 22px 60px;min-height:calc(100vh - 62px)}
.q-eye{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.q-eye-l{font-size:9.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--i)}
.q-eye-r{font-size:11.5px;font-weight:600;color:var(--muted)}
.q-card{position:relative;background:#fff;border:1px solid var(--border);border-radius:18px;padding:34px 30px 30px;box-shadow:0 2px 10px rgba(59,53,168,.07);overflow:hidden;margin-bottom:18px}
.q-ghost{position:absolute;right:18px;top:-6px;font-size:120px;font-weight:900;color:#e9e7f3;line-height:1;letter-spacing:-6px;pointer-events:none;user-select:none}
.q-txt{position:relative;z-index:2;font-size:clamp(19px,3.6vw,23px);font-weight:700;line-height:1.45;letter-spacing:-.3px;color:var(--ink);max-width:560px;margin-bottom:8px}
.q-ask{position:relative;z-index:2;font-size:12.5px;color:var(--muted);margin-bottom:22px}
.fmt-tag{position:relative;z-index:2;display:inline-block;font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--i);background:var(--cream);border-radius:10px;padding:3px 10px;margin-bottom:14px}
.resp{position:relative;z-index:2}
.poles{display:flex;justify-content:space-between;font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--muted);margin-top:10px}

/* Formato A · escala */
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 4px 12px;background:#fff;border:1.5px solid var(--border);border-radius:12px;cursor:pointer;transition:all .15s;color:var(--muted)}
.sbtn:hover{border-color:var(--i);color:var(--i)}
.sbtn b{font-size:22px;font-weight:800;line-height:1;color:var(--ink)}
.sbtn span{font-size:10.5px;font-weight:600}
.sbtn.on{background:var(--i);border-color:var(--i);color:rgba(255,255,255,.8)}
.sbtn.on b{color:#fff}

/* Formato B · elección */
.duel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dcard{text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:18px 18px 16px;cursor:pointer;transition:all .15s}
.dcard:hover{border-color:var(--i)}
.dcard.on{border-color:var(--i);background:var(--cream)}
.dcard-t{font-size:15px;font-weight:800;letter-spacing:-.2px;color:var(--ink);margin-bottom:4px}
.dcard-s{font-size:12px;line-height:1.5;color:var(--sub)}
.refine{margin-top:16px;text-align:center}
.refine-l{font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.refine-r{display:flex;gap:10px;justify-content:center}
.rbtn{min-width:78px;padding:12px 10px;background:#fff;border:1.5px solid var(--border);border-radius:12px;cursor:pointer;transition:all .15s;color:var(--muted)}
.rbtn b{display:block;font-size:20px;font-weight:800;color:var(--ink);line-height:1.1}
.rbtn span{font-size:10.5px;font-weight:600}
.rbtn:hover{border-color:var(--i)}
.rbtn.on{background:var(--i);border-color:var(--i);color:rgba(255,255,255,.8)}
.rbtn.on b{color:#fff}

/* Formato C · intensidad */
.sl-big{text-align:center;margin-bottom:14px}
.sl-num{font-size:48px;font-weight:900;letter-spacing:-1.5px;line-height:1;color:var(--i)}
.sl-num.off{color:#cfcce0}
.sl-lab{font-size:13px;font-weight:600;color:var(--sub);margin-top:4px;min-height:20px}
.qslider{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:4px;outline:none;border:none;padding:0;box-shadow:none;background:var(--border)}
.qslider::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--i);cursor:pointer;border:4px solid #fff;box-shadow:0 2px 10px rgba(59,53,168,.35)}
.qslider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--i);cursor:pointer;border:4px solid #fff}
.ticks{display:flex;justify-content:space-between;padding:0 6px;margin-top:8px;font-size:11px;font-weight:700;color:var(--muted)}

/* Formato D · lista */
.rlist{display:flex;flex-direction:column;gap:7px}
.rrow{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:11px 16px;cursor:pointer;transition:all .15s;width:100%}
.rrow:hover{border-color:var(--i)}
.rrow b{flex:0 0 28px;height:28px;border-radius:50%;background:var(--cream);color:var(--i);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.rrow span{font-size:14px;font-weight:600;color:var(--ink)}
.rrow.on{background:var(--i);border-color:var(--i)}
.rrow.on b{background:#fff;color:var(--i)}
.rrow.on span{color:#fff}

.q-nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.q-hint{font-size:12px;color:var(--muted)}

/* Hito */
.mid{max-width:560px;margin:0 auto;padding:60px 22px;text-align:center}
.mid-ring{width:92px;height:92px;border-radius:50%;border:6px solid var(--cream);border-top-color:var(--i);border-right-color:var(--i);margin:0 auto 22px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:var(--i);letter-spacing:-.5px}
.mid h2{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px}
.mid p{font-size:14.5px;line-height:1.75;color:var(--sub);margin-bottom:24px}
.mid-stats{display:flex;justify-content:center;gap:0;margin-bottom:28px}
.mid-stat{padding:0 26px;text-align:center}
.mid-stat+.mid-stat{border-left:1px solid var(--border)}
.mid-stat b{display:block;font-size:30px;font-weight:900;letter-spacing:-1px;color:var(--ink);line-height:1.1}
.mid-stat span{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* Envío */
.send-scr{max-width:560px;margin:0 auto;padding:70px 22px;text-align:center}
.send-scr h2{font-size:24px;font-weight:800;letter-spacing:-.4px;margin:18px 0 8px}
.send-scr p{font-size:14.5px;line-height:1.75;color:var(--sub);margin-bottom:20px}
.big-spin{width:46px;height:46px;border:4px solid var(--cream);border-top-color:var(--i);border-radius:50%;animation:sp .9s linear infinite;margin:0 auto}

/* Resultado (pantallazo) */
.res-hero{background:var(--ink);color:#fff;padding:44px 0 38px;position:relative;overflow:hidden}
.res-hero::after{content:"";position:absolute;right:-70px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(59,53,168,.4) 0%,transparent 66%)}
.res-hero .wrap{position:relative;z-index:2}
.res-ok{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:20px;padding:6px 14px;font-size:11.5px;font-weight:700;letter-spacing:.04em;margin-bottom:16px}
.res-ok svg{width:14px;height:14px}
.res-t{font-size:clamp(26px,5vw,36px);font-weight:800;letter-spacing:-.6px;line-height:1.12;margin-bottom:8px}
.res-s{font-size:14px;line-height:1.7;color:rgba(255,255,255,.7);max-width:520px}
.top3{display:flex;flex-direction:column;gap:12px;margin-bottom:26px}
.top-card{display:flex;gap:16px;align-items:flex-start;background:#fff;border:1px solid var(--border);border-left:4px solid var(--i);border-radius:0 14px 14px 0;padding:18px 20px;box-shadow:0 2px 10px rgba(59,53,168,.07)}
.top-card.first{border-left-color:var(--coral)}
.top-n{flex:0 0 34px;height:34px;border-radius:50%;background:var(--i);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center}
.top-card.first .top-n{background:var(--coral)}
.top-name{font-size:16px;font-weight:800;letter-spacing:-.2px;margin-bottom:3px}
.top-desc{font-size:13.5px;line-height:1.65;color:var(--sub)}
.radar-box{background:var(--ink);border-radius:16px;padding:18px 10px 6px;margin-bottom:26px}
.radar-box svg{display:block;width:100%;max-width:420px;margin:0 auto;height:auto}
.next-box{background:var(--cream);border-radius:14px;padding:20px 24px;font-size:14px;line-height:1.75;color:var(--sub)}
.next-box strong{color:var(--ink)}
.restart-confirm{max-width:480px;text-align:center;background:#fff;border:1.5px solid var(--coral);border-radius:14px;padding:18px 22px}
.restart2{display:flex;flex-direction:column;align-items:center;gap:14px;margin:34px 0 0;padding-top:24px;border-top:1px solid var(--border)}

@media(max-width:560px){
  .scale{grid-template-columns:repeat(3,1fr)}
  .duel,.steps3{grid-template-columns:1fr}
  .q-card{padding:28px 20px 24px}
  .refine-r{gap:6px}.rbtn{min-width:0;flex:1}
  .mid-stat{padding:0 14px}
}
</style>

function scores(){
  return ANCHORS.map(function(a,ix){

    return {id:a.id,name:a.name,sh:a.sh,d:a.d,ix:ix,s:s};

/* Radar (sin n\u00fameros: es un pantallazo) */
function radarSVG(list){
  var cx=210,cy=170,R=104,n=list.length,pts=[],lab='',axes='',rings='';
  [1/3,2/3,1].forEach(function(k){
    var p=list.map(function(_,i){var a=-Math.PI/2+i*2*Math.PI/n;return (cx+R*k*Math.cos(a)).toFixed(1)+','+(cy+R*k*Math.sin(a)).toFixed(1);}).join(' ');
    rings+='<polygon points="'+p+'" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1"/>';
  });
  list.forEach(function(it,i){
    var a=-Math.PI/2+i*2*Math.PI/n,c=Math.cos(a),s=Math.sin(a);
    axes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R*c).toFixed(1)+'" y2="'+(cy+R*s).toFixed(1)+'" stroke="rgba(255,255,255,.14)" stroke-width="1"/>';
    var r=R*Math.max(0.1,(it.s-1)/5);
    pts.push((cx+r*c).toFixed(1)+','+(cy+r*s).toFixed(1));
    var lx=cx+(R+18)*c,ly=cy+(R+18)*s+4,anc=c>0.3?'start':(c<-0.3?'end':'middle');
    lab+='<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="'+anc+'" font-size="12.5" font-weight="700" fill="#fff" font-family="Figtree,system-ui,sans-serif">'+it.sh+'</text>';
  });
  var dots=pts.map(function(p){var xy=p.split(',');return '<circle cx="'+xy[0]+'" cy="'+xy[1]+'" r="3.5" fill="#fff"/>';}).join('');
  return '<svg viewBox="0 0 420 345" role="img" aria-label="Perfil de anclas">'+rings+axes+'<polygon points="'+pts.join(' ')+'" fill="rgba(212,82,42,.35)" stroke="#d4522a" stroke-width="2.5" stroke-linejoin="round"/>'+dots+lab+'</svg>';
}

/* \u2500\u2500 L\u00d3GICA DE LA EVALUACI\u00d3N \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
function checkStart(){
  var b=$('btnStart');if(!b)return;
  b.disabled=!(state.nombre.trim().length>1&&state.apellido.trim().length>1&&validEmail(state.email));
}
function startEval(){
  state.nombre=state.nombre.trim();state.apellido=state.apellido.trim();state.email=state.email.trim();
  if(!state.sid)state.sid=newSid();
  if(!state.started)state.started=Date.now();
  state.q=0;save();show('q');
}
function curQ(){return QUESTIONS[state.q];}
function setAnswer(v,auto){
  var q=curQ();state.ans[q.id]=v;save();
  var idx=state.q;
  /* actualizar interfaz sin re-render completo */
  var f=fmtOf(idx);
  if(f==='C'){
    $('slNum').textContent=v;$('slNum').classList.remove('off');$('slLab').textContent=LONG_LABELS[v];
    var sl=$('qslider');sl.style.background='linear-gradient(to right,#3b35a8 '+(v/6*100)+'%,#e2e0ea '+(v/6*100)+'%)';
  }else{
    $('resp').innerHTML=respHTML(idx,v);
  }
  $('btnNext').disabled=false;$('qHint').textContent='';
  if(auto){
    setTimeout(function(){if(view==='q'&&state.q===idx)advance();},260);
  }
}
function advance(){
  if(state.q===MID_Q-1&&!state.midSeen){state.midSeen=true;save();show('mid');return;}
  if(state.q<TOTAL-1){state.q++;save();show('q');}
  else finish();
}
function goPrev(){
  if(state.q>0){state.q--;save();show('q');}
  else show('intro');
}
function finish(){
  state.done=true;
  state.minutos=Math.max(1,Math.min(240,Math.round((Date.now()-(state.started||Date.now()))/60000)));
  save();sendErr='';show('sending');sendEval();
}
function payload(){
  var r={};QUESTIONS.forEach(function(q){r[q.id]=state.ans[q.id];});
  return {sid:state.sid,nombre:state.nombre.trim(),apellido:state.apellido.trim(),email:state.email.trim(),respuestas:r,minutos:state.minutos};
}
async function sendEval(){
  if(sending)return;sending=true;
  try{
    if(APPS_SCRIPT_URL.indexOf('http')!==0)throw new Error('NO_URL');
    var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort();},45000);
    var res=await fetch(APPS_SCRIPT_URL,{method:'POST',body:JSON.stringify(payload()),signal:ctl.signal});
    clearTimeout(tm);
    var data=await res.json();
    if(!data||!data.ok)throw new Error((data&&data.error)||'ERR');
    state.sent=true;save();sendErr='';sending=false;show('result');return;
  }catch(err){
    console.error(err);
    sendErr=(err&&err.message==='NO_URL')?'El env\u00edo todav\u00eda no est\u00e1 conectado. Avis\u00e1 a tu coach para completar la configuraci\u00f3n.'
      :(err&&err.message==='LIMIT_EMAIL'?'Ya se enviaron varias evaluaciones con este email en el d\u00eda. Prob\u00e1 de nuevo ma\u00f1ana o escribile a tu coach.'
      :'No hubo conexi\u00f3n con el servidor o tard\u00f3 demasiado. Revis\u00e1 tu conexi\u00f3n y volv\u00e9 a intentar.');
  }
  sending=false;
  if(view==='sending')show('sending');
}
function resetAll(){
  try{localStorage.removeItem(LS_KEY);}catch(e){}
  state=freshState();side={};sendErr='';sending=false;
  show('intro');toast('Listo, empez\u00e1s de cero.');
}

/* \u2500\u2500 EVENTOS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='fName'){state.nombre=e.target.value;save();checkStart();}
  else if(id==='fLast'){state.apellido=e.target.value;save();checkStart();}
  else if(id==='fMail'){state.email=e.target.value;save();checkStart();}
  else if(id==='qslider'){var v=parseInt(e.target.value,10);if(v>0)setAnswer(v,false);else{$('slNum').textContent='\u2014';$('slNum').classList.add('off');$('slLab').textContent='Mov\u00e9 el control para responder';e.target.style.background='#e2e0ea';delete state.ans[curQ().id];save();$('btnNext').disabled=true;}}
});
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-action]');if(!el)return;
  var a=el.getAttribute('data-action');
  switch(a){
    case 'start':if(!el.disabled)startEval();break;
    case 'resume':if(state.sid){show('q');}break;
    case 'ans':setAnswer(parseInt(el.getAttribute('data-v'),10),true);break;
    case 'side':{side[state.q]=el.getAttribute('data-s');$('resp').innerHTML=respHTML(state.q,state.ans[curQ().id]);break;}
    case 'next':if(!el.disabled)advance();break;
    case 'prev':goPrev();break;
    case 'midGo':state.q=MID_Q;save();show('q');break;
    case 'retry':sendErr='';show('sending');sendEval();break;
    case 'restartAsk':{
      if(!el.getAttribute('data-armed')){el.setAttribute('data-armed','1');var old=el.textContent;el.textContent='Toc\u00e1 de nuevo para confirmar';setTimeout(function(){el.removeAttribute('data-armed');el.textContent=old;},3500);break;}
      resetAll();break;}
    case 'restart':$('btnRestart').classList.add('hidden');$('restartConfirm').classList.remove('hidden');break;
    case 'restartNo':$('restartConfirm').classList.add('hidden');$('btnRestart').classList.remove('hidden');break;
    case 'restartYes':resetAll();break;
  }
});
document.addEventListener('keydown',function(e){
  if(view!=='q')return;
  var t=e.target&&e.target.tagName;if(t==='INPUT'&&e.target.type!=='range')return;
  if(/^[1-6]$/.test(e.key)){e.preventDefault();var v=parseInt(e.key,10),f=fmtOf(state.q);
    if(f==='B'){side[state.q]=v<=3?'lo':'hi';}
    setAnswer(v,f!=='C');if(f==='B'){$('resp').innerHTML=respHTML(state.q,v);}}
  else if(e.key==='ArrowLeft'){goPrev();}
  else if((e.key==='ArrowRight'||e.key==='Enter')&&state.ans[curQ().id]&&t!=='BUTTON'){advance();}
});

/* \u2500\u2500 ARRANQUE \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
load();
if(state.sent){show('result');}
else if(state.done){sendErr='';show('sending');sendEval();}
else{show('intro');}
</script>
