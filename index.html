<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anclas de Carrera · Tenkai Consulting</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --tk-indigo:#3b35a8;--tk-deep:#2d2894;--tk-magenta:#8b3a8f;--tk-coral:#d4522a;
  --tk-grad:linear-gradient(135deg,#3b35a8 0%,#8b3a8f 50%,#d4522a 100%);
  --tk-grad-h:linear-gradient(90deg,#3b35a8 0%,#d4522a 100%);
  --tk-bg:#f0eff5;--tk-ink:#1a1a2e;--tk-sub:#555566;--tk-muted:#888899;
  --tk-white:#ffffff;--tk-border:#e2e0ea;--tk-card:#ffffff;--tk-cream:#ece9f4;
  --f:'Figtree',system-ui,sans-serif;
}
body{font-family:var(--f);background:var(--tk-bg);color:var(--tk-ink);min-height:100vh;-webkit-font-smoothing:antialiased}

@media print{
  .no-print{display:none!important}
  body{background:#fff}
  .dk{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .hero-dark{background:#1a1a2e!important}
  .radar-bg{background:#1a1a2e!important}
  .cta-dark{background:#1a1a2e!important}
  .hdr{position:relative}
}

.wrap{max-width:720px;margin:0 auto;padding:0 22px}

/* HEADER */
.hdr{background:rgba(255,255,255,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--tk-border);position:sticky;top:0;z-index:99}
.hdr-in{display:flex;align-items:center;justify-content:space-between;padding:10px 22px;max-width:720px;margin:0 auto}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr-logo{width:42px;height:42px;border-radius:9px;object-fit:cover;box-shadow:0 2px 10px rgba(59,53,168,.18);flex-shrink:0}
.hdr-brand{font-size:14px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;background:var(--tk-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1}
.hdr-sub{font-size:10px;color:var(--tk-muted);letter-spacing:.8px;font-weight:400;margin-top:1px}
.prog-wrap{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--tk-muted);font-weight:500}
.prog-bar{width:90px;height:3px;background:var(--tk-border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--tk-grad);border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* HERO */
.hero{height:280px;background:var(--tk-grad);position:relative;display:flex;align-items:flex-end;overflow:hidden}
.hero::before{content:"";position:absolute;top:-80px;right:-80px;width:360px;height:360px;background:radial-gradient(circle,rgba(255,255,255,.08) 0%,transparent 65%);pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(15,15,20,.72) 0%,transparent 55%)}
.hero-geo{position:absolute;bottom:0;left:0;opacity:.1}
.hero-txt{position:relative;z-index:2;padding:32px 22px;max-width:720px;margin:0 auto;width:100%}
.hero-eye{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.42);margin-bottom:9px}
.hero-h1{font-size:clamp(30px,5.5vw,48px);font-weight:900;line-height:1.05;color:#fff;letter-spacing:-1.5px}
.hero-h1 em{font-style:italic;font-weight:300;color:rgba(255,255,255,.5)}

/* INTRO */
.intro-sec{padding:44px 0 60px}
.intro-p{font-size:16px;line-height:1.8;color:var(--tk-sub);font-weight:300;max-width:480px;margin-bottom:32px}
.lbl{display:block;font-size:10px;font-weight:700;letter-spacing:2.6px;text-transform:uppercase;color:var(--tk-muted);margin-bottom:9px}
.txt-in{width:100%;max-width:360px;padding:14px 18px;display:block;margin-bottom:28px;font-family:var(--f);font-size:18px;font-weight:600;color:var(--tk-ink);background:#fff;border:1.5px solid var(--tk-border);border-radius:10px;outline:none;transition:border-color .2s}
.txt-in:focus{border-color:var(--tk-indigo)}
.txt-in::placeholder{color:var(--tk-border);font-weight:300}
.instr{background:#fff;border:1px solid var(--tk-border);border-left:3px solid var(--tk-indigo);border-radius:10px;padding:20px 24px;margin-bottom:32px;max-width:480px}
.instr p{font-size:14px;line-height:1.8;color:var(--tk-sub);font-weight:300}
.instr strong{color:var(--tk-ink);font-weight:700}

.fmt-preview{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:36px;max-width:500px}
.fmt-badge{background:#fff;border:1px solid var(--tk-border);border-radius:10px;padding:14px;text-align:center}
.fmt-badge-icon{font-size:22px;margin-bottom:6px}
.fmt-badge-txt{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--tk-muted)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:9px;padding:14px 30px;background:var(--tk-grad-h);color:#fff;font-family:var(--f);font-size:14px;font-weight:700;border:none;border-radius:28px;cursor:pointer;box-shadow:0 4px 18px rgba(59,53,168,.22);transition:all .2s;letter-spacing:.04em}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(59,53,168,.30)}
.btn:disabled{background:var(--tk-border);color:var(--tk-muted);cursor:not-allowed;transform:none;box-shadow:none}
.btn-g{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;background:transparent;color:var(--tk-muted);font-family:var(--f);font-size:13px;font-weight:500;border:1px solid var(--tk-border);border-radius:20px;cursor:pointer;transition:all .2s}
.btn-g:hover{color:var(--tk-ink);border-color:var(--tk-ink)}
.btn-mail{display:inline-flex;align-items:center;gap:9px;padding:14px 28px;background:var(--tk-grad-h);color:#fff;font-family:var(--f);font-size:14px;font-weight:700;border:none;border-radius:28px;cursor:pointer;text-decoration:none;box-shadow:0 4px 18px rgba(59,53,168,.22);transition:all .2s}
.btn-mail:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(59,53,168,.30)}

/* QUESTION SCREEN */
.q-scr{padding:44px 0 60px;min-height:calc(100vh - 63px);display:flex;flex-direction:column}
.q-eye{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--tk-muted);margin-bottom:32px;display:flex;align-items:center;gap:10px}
.q-eye-dot{width:8px;height:8px;border-radius:50%;background:var(--tk-grad);display:inline-block;flex-shrink:0}
.q-wrap{position:relative;margin-bottom:36px}
/* numero de fondo: mas visible, color solido con baja opacidad */
.q-num{font-size:clamp(80px,15vw,130px);font-weight:900;line-height:1;color:#d6d3e8;position:absolute;top:-14px;right:-6px;user-select:none;pointer-events:none;letter-spacing:-4px}
.q-txt{font-size:clamp(19px,3.2vw,26px);font-weight:700;line-height:1.35;color:var(--tk-ink);max-width:500px;padding-right:80px;position:relative;z-index:1;letter-spacing:-.3px}
.q-type-tag{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:4px 10px;border-radius:20px;margin-bottom:22px}
.q-nav{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--tk-border);padding-top:24px;margin-top:auto}
.q-hint{font-size:12px;color:var(--tk-border);font-style:italic;text-align:center}

/* TYPE A: SCALE */
.scale-wrap{margin-bottom:36px}
.scale-track{display:flex;gap:8px;align-items:stretch}
.scale-btn{flex:1;border:1.5px solid var(--tk-border);background:#fff;border-radius:12px;font-family:var(--f);font-size:clamp(18px,3vw,24px);font-weight:800;color:var(--tk-muted);cursor:pointer;transition:all .15s;padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;line-height:1}
.scale-btn .sc-label{font-size:9px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;opacity:.5}
.scale-btn:hover{border-color:var(--tk-indigo);color:var(--tk-ink);background:#f0eeff;transform:translateY(-2px)}
.scale-btn.on{background:var(--tk-grad);border-color:transparent;color:#fff;transform:translateY(-3px) scale(1.04);box-shadow:0 6px 20px rgba(59,53,168,.3)}
.scale-btn.on .sc-label{opacity:.7}
.scale-poles{display:flex;justify-content:space-between;margin-top:10px;padding:0 2px}
.scale-pole{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--tk-muted)}

/* TYPE B: CARD PICK */
.card-duel{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.duel-card{background:#fff;border:2px solid var(--tk-border);border-radius:16px;padding:24px 20px;cursor:pointer;transition:all .2s;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;overflow:hidden}
.duel-card::before{content:"";position:absolute;inset:0;background:var(--tk-grad);opacity:0;transition:opacity .2s}
.duel-card:hover{border-color:var(--tk-indigo);transform:translateY(-3px);box-shadow:0 8px 24px rgba(59,53,168,.12)}
.duel-card.on{border-color:transparent;transform:translateY(-3px);box-shadow:0 8px 28px rgba(59,53,168,.25)}
.duel-card.on::before{opacity:1}
.duel-card-icon{font-size:32px;position:relative;z-index:1}
.duel-card-txt{font-size:15px;font-weight:700;color:var(--tk-ink);line-height:1.35;position:relative;z-index:1;transition:color .2s}
.duel-card.on .duel-card-txt{color:#fff}
.duel-card-sub{font-size:11px;color:var(--tk-muted);font-weight:400;position:relative;z-index:1;transition:color .2s;line-height:1.5}
.duel-card.on .duel-card-sub{color:rgba(255,255,255,.6)}

/* TYPE C: SLIDER */
.slider-wrap{margin-bottom:36px}
.slider-track-wrap{position:relative;padding:16px 0;margin-bottom:16px}
.slider-input{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:var(--tk-border);outline:none;cursor:pointer}
.slider-input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;border-radius:50%;background:var(--tk-grad);border:3px solid #fff;box-shadow:0 3px 12px rgba(59,53,168,.3);cursor:grab;transition:transform .1s}
.slider-input::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.15)}
.slider-input::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--tk-indigo);border:3px solid #fff;box-shadow:0 3px 12px rgba(59,53,168,.3);cursor:grab}
.slider-poles{display:flex;justify-content:space-between;margin-bottom:8px}
.slider-pole{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--tk-muted)}
.slider-val-display{text-align:center;font-size:48px;font-weight:900;background:var(--tk-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;transition:all .15s}
.slider-val-label{text-align:center;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--tk-muted);margin-top:4px;min-height:16px}

/* TYPE D: EMOJI — rediseñado */
.emoji-wrap{margin-bottom:36px}
.emoji-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.emoji-btn{background:#fff;border:2px solid var(--tk-border);border-radius:14px;padding:14px 8px;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f)}
.emoji-btn:hover{border-color:var(--tk-indigo);transform:translateY(-2px);box-shadow:0 5px 16px rgba(59,53,168,.10)}
.emoji-btn.on{border-color:transparent;background:var(--tk-grad);transform:translateY(-2px) scale(1.03);box-shadow:0 6px 20px rgba(59,53,168,.28)}
.emoji-icon{font-size:24px;line-height:1}
.emoji-num{font-size:16px;font-weight:800;color:var(--tk-ink);transition:color .15s;line-height:1.2}
.emoji-btn.on .emoji-num{color:#fff}
.emoji-lbl-main{font-size:11px;font-weight:700;color:var(--tk-ink);text-align:center;line-height:1.2;transition:color .15s}
.emoji-btn.on .emoji-lbl-main{color:#fff}
.emoji-lbl-sub{font-size:9px;font-weight:500;letter-spacing:.5px;color:var(--tk-muted);text-align:center;line-height:1.2;transition:color .15s}
.emoji-btn.on .emoji-lbl-sub{color:rgba(255,255,255,.65)}

/* MIDPOINT SCREEN */
.mid-scr{padding:60px 0;min-height:calc(100vh - 63px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mid-ring{width:96px;height:96px;border-radius:50%;background:var(--tk-grad);display:flex;align-items:center;justify-content:center;margin:0 auto 28px;box-shadow:0 8px 30px rgba(59,53,168,.3)}
.mid-ring-icon{font-size:40px}
.mid-pct{font-size:clamp(48px,8vw,72px);font-weight:900;background:var(--tk-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-3px;line-height:1;margin-bottom:4px}
.mid-label{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--tk-muted);margin-bottom:32px}
.mid-h{font-size:clamp(22px,4vw,32px);font-weight:800;color:var(--tk-ink);letter-spacing:-.5px;line-height:1.2;margin-bottom:14px;max-width:380px}
.mid-p{font-size:15px;line-height:1.75;color:var(--tk-sub);font-weight:300;max-width:360px;margin:0 auto 36px}
.mid-stats{display:flex;gap:24px;justify-content:center;margin-bottom:36px}
.mid-stat{text-align:center}
.mid-stat-n{font-size:28px;font-weight:900;background:var(--tk-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px;line-height:1}
.mid-stat-l{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--tk-muted);margin-top:3px}

/* RESULTS */
.res-scr{padding:44px 0 72px}
.hero-dark{background:var(--tk-ink);border-radius:14px;padding:40px;margin-bottom:36px;position:relative;overflow:hidden}
.hero-dark::before{content:"";position:absolute;top:-50px;right:-50px;width:280px;height:280px;background:radial-gradient(circle,rgba(139,58,143,.28) 0%,transparent 68%);pointer-events:none}
.hero-dark::after{content:"";position:absolute;bottom:-35px;left:-35px;width:180px;height:180px;background:radial-gradient(circle,rgba(212,82,42,.18) 0%,transparent 68%);pointer-events:none}
.res-eye{font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.28);margin-bottom:11px;position:relative;z-index:1}
.res-name{font-size:clamp(26px,5vw,42px);font-weight:900;color:#fff;margin-bottom:5px;position:relative;z-index:1;letter-spacing:-1px}
.res-sub{font-size:13px;color:rgba(255,255,255,.3);font-weight:300;position:relative;z-index:1}
.sec-lbl{font-size:10px;font-weight:700;letter-spacing:2.6px;text-transform:uppercase;color:var(--tk-muted);margin-bottom:14px;padding-bottom:11px;border-bottom:1px solid var(--tk-border)}
.radar-bg{background:var(--tk-ink);border-radius:14px;padding:36px 20px 28px;display:flex;justify-content:center;margin-bottom:36px}
.rank-row{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid var(--tk-cream)}
.rank-n{font-size:22px;font-weight:900;color:var(--tk-border);width:28px;flex-shrink:0;text-align:right;line-height:1;font-style:italic}
.rank-n.top{background:var(--tk-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.rank-name{font-size:14px;font-weight:600;color:var(--tk-ink);flex:1}
.rank-pill{font-size:12px;font-weight:700;padding:3px 12px;border-radius:20px;flex-shrink:0}
.cta-dark{background:var(--tk-ink);border-radius:14px;padding:44px 36px;text-align:center;position:relative;overflow:hidden;margin-bottom:44px}
.cta-dark::before{content:"";position:absolute;top:-70px;left:50%;transform:translateX(-50%);width:300px;height:300px;background:radial-gradient(circle,rgba(59,53,168,.18) 0%,transparent 65%);pointer-events:none}
.cta-h{font-size:clamp(20px,3.5vw,28px);font-weight:800;color:#fff;margin-bottom:11px;position:relative;z-index:1;letter-spacing:-.5px}
.cta-p{font-size:15px;line-height:1.75;color:rgba(255,255,255,.4);font-weight:300;max-width:380px;margin:0 auto 28px;position:relative;z-index:1}
.cta-acts{display:flex;flex-direction:column;align-items:center;gap:13px;position:relative;z-index:1}
.cta-hint{font-size:11px;color:rgba(255,255,255,.2);margin-top:2px}
.ftr{padding:32px 0 20px;border-top:1px solid var(--tk-border);text-align:center}
.ftr-logo{width:56px;height:56px;border-radius:11px;object-fit:cover;margin:0 auto 13px;display:block;box-shadow:0 4px 16px rgba(59,53,168,.18)}
.ftr-brand{font-size:13px;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;background:var(--tk-grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:3px}
.ftr-url{font-size:12px;color:var(--tk-muted);margin-bottom:18px;font-weight:300}
.soc-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.soc-a{display:flex;align-items:center;gap:7px;padding:8px 14px;background:#fff;border:1px solid var(--tk-border);border-radius:7px;text-decoration:none;color:var(--tk-muted);font-size:12px;font-weight:600;transition:all .2s}
.soc-a:hover{border-color:var(--tk-indigo);color:var(--tk-indigo);transform:translateY(-1px)}
.soc-a svg{width:15px;height:15px;flex-shrink:0}
.ftr-copy{font-size:11px;color:var(--tk-border);letter-spacing:.4px}

@keyframes fUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.fup{animation:fUp .35s cubic-bezier(.4,0,.2,1) both}
@keyframes fIn{from{opacity:0}to{opacity:1}}
.fin{animation:fIn .42s ease both}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.pop{animation:pop .28s cubic-bezier(.4,0,.2,1) both}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
</style>
</head>
<body>
<div id="root"></div>

function calcScores(ans){
  return ANCHORS.map(a=>{
    const vs=a.qs.map(q=>ans[q]||0).filter(v=>v>0);
    const s=vs.length?parseFloat((vs.reduce((x,v)=>x+v,0)/vs.length).toFixed(1)):0;
    return {...a,s};
  }).sort((a,b)=>b.s-a.s);
}

/* RADAR — labels con posicionamiento adaptivo por octante */
function Radar({sc}){
  const S=420,cx=210,cy=210,R=100;
  const n=sc.length;
  const ang=i=>(Math.PI*2/n)*i-Math.PI/2;
  const pt=(i,r)=>({x:cx+r*Math.cos(ang(i)),y:cy+r*Math.sin(ang(i))});
  const dp=sc.map((s,i)=>{const r=(s.s/6)*R;const p=pt(i,r);return`${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`}).join(" ")+"Z";

  /* Para cada nodo calculamos offset del label segun angulo exacto */
  function getLabelPos(i){
    const a=ang(i);
    const BASE=R+22; // distancia minima borde poligono -> label score
    const lx=cx+BASE*Math.cos(a);
    const ly=cy+BASE*Math.sin(a);
    // texto de nombre: 18px mas lejos
    const nx=cx+(BASE+20)*Math.cos(a);
    const ny=cy+(BASE+20)*Math.sin(a);
    // alineacion horizontal segun posicion x respecto al centro
    let ta="middle";
    if(lx<cx-18)ta="end";
    else if(lx>cx+18)ta="start";
    return {lx,ly,nx,ny,ta};
  }

  return(
    <svg viewBox={`0 0 ${S} ${S}`} style={{width:"100%",maxWidth:420,height:"auto",overflow:"visible",display:"block",margin:"0 auto"}}>
      <defs>
        <linearGradient id="gs" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor="#3b35a8"/>
          <stop offset="50%" stopColor="#8b3a8f"/>
          <stop offset="100%" stopColor="#d4522a"/>
        </linearGradient>
      </defs>
      {[1,2,3,4,5,6].map(lv=>{
        const r=(lv/6)*R;
        const pts=sc.map((_,i)=>{const p=pt(i,r);return`${p.x.toFixed(1)},${p.y.toFixed(1)}`}).join(" ");
        return <polygon key={lv} points={pts} fill="none" stroke={lv===6?"rgba(255,255,255,.18)":"rgba(255,255,255,.07)"} strokeWidth={lv===6?1.5:1}/>;
      })}
      {[2,4,6].map(lv=>{const r=(lv/6)*R;const p=pt(0,r);return <text key={lv} x={p.x+4} y={p.y} fill="rgba(255,255,255,.2)" fontSize="8" fontFamily="Figtree,sans-serif" fontWeight="500">{lv}</text>;})}
      {sc.map((_,i)=>{const p=pt(i,R);return <line key={i} x1={cx} y1={cy} x2={p.x.toFixed(1)} y2={p.y.toFixed(1)} stroke="rgba(255,255,255,.09)" strokeWidth="1"/>;}) }
      <path d={dp} fill="rgba(59,53,168,.15)" stroke="url(#gs)" strokeWidth="2.5"/>
      {sc.map((s,i)=>{const r=(s.s/6)*R;const p=pt(i,r);return <circle key={i} cx={p.x.toFixed(1)} cy={p.y.toFixed(1)} r="4.5" fill={s.c} stroke="rgba(15,15,20,.85)" strokeWidth="1.5"/>;}) }
      {sc.map((s,i)=>{
        const {lx,ly,nx,ny,ta}=getLabelPos(i);
        return(
          <g key={i}>
            <text x={nx.toFixed(1)} y={ny.toFixed(1)} textAnchor={ta} dominantBaseline="middle"
              fill="rgba(248,247,244,.75)" fontSize="8.5" fontFamily="Figtree,sans-serif"
              fontWeight="700" letterSpacing="0.5">{s.sh.toUpperCase()}</text>
            <text x={lx.toFixed(1)} y={ly.toFixed(1)} textAnchor={ta} dominantBaseline="middle"
              fill={s.c} fontSize="11.5" fontFamily="Figtree,sans-serif" fontWeight="800">
              {s.s>0?s.s+"/6":"—"}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

          <button key={v} className={"scale-btn"+(val===v?" on":"")} onClick={()=>onPick(qid,v)}>

}

/* TYPE C: SLIDER */
function TypeSlider({qid, val, onPick}){
  const sliderLabels={0:"―",1:"Nada importante",2:"Poco importante",3:"Algo importante",4:"Bastante importante",5:"Muy importante",6:"Totalmente clave"};
  const [draft,setDraft]=React.useState(val||0);
  const v=draft;
  return(
    <div className="slider-wrap">
      <div style={{textAlign:"center",marginBottom:16}}>
        <div className="slider-val-display">{v>0?v:"―"}</div>
        <div className="slider-val-label">{sliderLabels[v]}</div>
      </div>
      <div className="slider-track-wrap">
        <input className="slider-input" type="range" min="0" max="6" step="1" value={v}
          onChange={e=>{const nv=parseInt(e.target.value);setDraft(nv);if(nv>0)onPick(qid,nv);}}
          style={{background:`linear-gradient(to right,#3b35a8 0%,#d4522a ${(v/6)*100}%,#e2e0ea ${(v/6)*100}%,#e2e0ea 100%)`}}
        />
      </div>
      <div className="slider-poles">
        <span className="slider-pole">Menos importante</span>
        <span className="slider-pole">Más importante</span>
      </div>
    </div>
  );
}

            <span className="emoji-num">{o.v}</span>
            <span className="emoji-lbl-main">{o.lbl}</span>
            <span className="emoji-lbl-sub">{o.sub}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

/* TYPE B: CARD PICK */
function TypeCardPick({qid, val, onPick}){
  return(
    <div>
      <p style={{fontSize:13,color:"var(--tk-sub)",marginBottom:14,fontStyle:"italic"}}>
        ¿Cuánto te describe esta afirmación?
      </p>
      <div className="card-duel">
        <div className={"duel-card"+(val&&val<=3?" on":"")} onClick={()=>onPick(qid,val&&val<=3?val:2)}>
          <span className="duel-card-icon">🙅</span>
          <span className="duel-card-txt">No me define</span>
          <span className="duel-card-sub">Esta motivación tiene poco peso en mis decisiones</span>
        </div>
        <div className={"duel-card"+(val&&val>=4?" on":"")} onClick={()=>onPick(qid,val&&val>=4?val:5)}>
          <span className="duel-card-icon">✅</span>
          <span className="duel-card-txt">Sí me define</span>
          <span className="duel-card-sub">Esta motivación impulsa mis decisiones de carrera</span>
        </div>
      </div>
      {val&&(
        <div style={{marginTop:12}}>
          <p style={{fontSize:11,fontWeight:700,letterSpacing:2,textTransform:"uppercase",color:"var(--tk-muted)",marginBottom:10,textAlign:"center"}}>
            {val<=3?"Cuánto NO te define":"Cuánto Sí te define"} — afiná tu respuesta
          </p>
          <div style={{display:"flex",gap:8,justifyContent:"center"}}>
            {(val<=3?[1,2,3]:[4,5,6]).map(v=>(
              <button key={v} onClick={()=>onPick(qid,v)} style={{
                width:52,height:52,borderRadius:12,border:"2px solid",
                borderColor:val===v?"transparent":"var(--tk-border)",
                background:val===v?"var(--tk-grad-h)":"#fff",
                color:val===v?"#fff":"var(--tk-muted)",
                fontFamily:"var(--f)",fontSize:20,fontWeight:800,cursor:"pointer",transition:"all .15s",
                boxShadow:val===v?"0 4px 14px rgba(59,53,168,.25)":"none"
              }}>{v}</button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

const TYPE_META={
  A:{label:"Escala",    icon:"📊",color:"#3b35a8"},
  B:{label:"Elección",   icon:"🎯",color:"#d4522a"},
  C:{label:"Slider",    icon:"🎮",color:"#8b3a8f"},
  D:{label:"Reacción",   icon:"⚡",    color:"#d4a017"},
};

/* MIDPOINT SCREEN */
function MidpointScreen({name, answered, onContinue}){
  return(
    <div className="wrap">
      <div className="mid-scr fup">
        <div className="mid-ring"><span className="mid-ring-icon">🏆</span></div>
        <div className="mid-pct">50%</div>
        <div className="mid-label">Completado</div>
        <h2 className="mid-h">¡Vas muy bien{name?", "+name.split(" ")[0]:""}!</h2>
        <p className="mid-p">Ya respondiste la mitad del diagnóstico. Tus respuestas están construyendo un perfil único de tus motivaciones profesionales. ¡Seguí así!</p>
        <div className="mid-stats">
          <div className="mid-stat">
            <div className="mid-stat-n">{answered}</div>
            <div className="mid-stat-l">Respondidas</div>
          </div>
          <div className="mid-stat" style={{borderLeft:"1px solid var(--tk-border)",paddingLeft:24}}>
            <div className="mid-stat-n">{41-answered}</div>
            <div className="mid-stat-l">Restantes</div>
          </div>
          <div className="mid-stat" style={{borderLeft:"1px solid var(--tk-border)",paddingLeft:24}}>
            <div className="mid-stat-n">8</div>
            <div className="mid-stat-l">Anclas del modelo</div>
          </div>
        </div>
        <button className="btn" onClick={onContinue} style={{animation:"pulse 2s ease-in-out infinite"}}>
          Continuar el diagnóstico
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>
  );
}

function QuestionBlock({question,val,onPick}){
  const meta=TYPE_META[question.type];
  return(
    <div>
      <span className="q-type-tag" style={{background:meta.color+"14",color:meta.color,border:`1px solid ${meta.color}30`}}>
        {meta.icon} {meta.label}
      </span>
      {question.type==="A"&&<TypeScale qid={question.id} val={val} onPick={onPick}/>}
      {question.type==="B"&&<TypeCardPick qid={question.id} val={val} onPick={onPick}/>}
      {question.type==="C"&&<TypeSlider qid={question.id} val={val} onPick={onPick}/>}
      {question.type==="D"&&<TypeEmoji qid={question.id} val={val} onPick={onPick}/>}
    </div>
  );
}

const MIDPOINT_Q = 20; /* mostrar pantalla de incentivo despues de Q20 */

function App(){
  const [view,setView]=React.useState("intro");
  const [name,setName]=React.useState("");
  const [ans,setAns]=React.useState({});
  const [q,setQ]=React.useState(0);
  const [ak,setAk]=React.useState(0);
  const total=QUESTIONS.length;
  const sc=calcScores(ans);
  const answered=Object.keys(ans).length;
  const pct=view==="questions"?Math.round((q/total)*100):view==="results"?100:0;

  const goNext=()=>{
    if(q<total-1){setQ(x=>x+1);setAk(x=>x+1);window.scrollTo({top:0,behavior:"smooth"});}
    else{setView("results");window.scrollTo({top:0,behavior:"smooth"});}
  };
  const goPrev=()=>{
    if(q>0){setQ(x=>x-1);setAk(x=>x+1);window.scrollTo({top:0,behavior:"smooth"});}
    else setView("intro");
  };

  const pick=(id,v)=>{
    setAns(p=>({...p,[id]:v}));
    const qt=QUESTIONS.find(q=>q.id===id);
    if(qt&&(qt.type==="A"||qt.type==="D")){
      setTimeout(()=>{
        /* check if we just finished Q20 -> show midpoint */
        if(q===MIDPOINT_Q-1){setView("midpoint");}
        else if(q<total-1){setQ(x=>x+1);setAk(x=>x+1);window.scrollTo({top:0,behavior:"smooth"});}
        else{setView("results");window.scrollTo({top:0,behavior:"smooth"});}
      },260);
    } else {
      /* for slider/card: just update, user taps Siguiente */
      if(q===MIDPOINT_Q-1 && v){/* handled by nav button */}
    }
  };

  const handleNext=()=>{
    if(q===MIDPOINT_Q-1){setView("midpoint");}
    else goNext();
  };

  const cur=QUESTIONS[q];
  const curVal=ans[cur?.id];
  const subj=encodeURIComponent("Anclas de Carrera — "+name);
  const body=encodeURIComponent("Hola Esteban,\n\nAcabo de completar el diagnóstico de Anclas de Carrera.\nTe adjunto el PDF con mis resultados.\n\nNombre: "+name+"\n\nQuedo a la espera de tu análisis.\n\nSaludos");

  return(
    <div>
      {/* HEADER */}
      <header className="hdr no-print">
        <div className="hdr-in">
          <div className="hdr-left">
            <img src={LOGO} alt="Tenkai" className="hdr-logo"/>
            <div>
              <div className="hdr-brand">Tenkai</div>
              <div className="hdr-sub">Consulting</div>
            </div>
          </div>
          <div className="prog-wrap">
            {view==="questions"&&<><span style={{fontWeight:700,color:"var(--tk-indigo)"}}>{q+1}/{total}</span><div className="prog-bar"><div className="prog-fill" style={{width:pct+"%"}}/></div></>}
            {view==="intro"&&<span>Anclas de Carrera · Schein</span>}
            {view==="midpoint"&&<><span style={{fontWeight:700,color:"var(--tk-indigo)"}}>{MIDPOINT_Q}/{total}</span><div className="prog-bar"><div className="prog-fill" style={{width:"50%"}}/></div></>}
            {view==="results"&&<span style={{background:"var(--tk-grad)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",backgroundClip:"text",fontWeight:700}}>Diagnóstico completo</span>}
          </div>
        </div>
      </header>

      {/* INTRO */}
      {view==="intro"&&(
        <div className="fin">
          <div className="hero">
            <svg className="hero-geo" width="300" height="220" viewBox="0 0 300 220">
              <polygon points="0,220 180,0 300,220" fill="rgba(255,255,255,.04)"/>
              <polygon points="60,220 240,0 300,220" fill="rgba(255,255,255,.03)"/>
            </svg>
            <div className="hero-txt">
              <p className="hero-eye">Instrumento de Diagnóstico · Tenkai Consulting</p>
              <h1 className="hero-h1">Tus Anclas<br/><em>de Carrera</em></h1>
            </div>
          </div>
          <div className="wrap">
            <div className="intro-sec">
              <p className="intro-p">Edgar Schein identificó ocho motivaciones profundas que orientan nuestras decisiones profesionales. Este instrumento —41 afirmaciones, unos 15 minutos— revela cuáles son las tuyas.</p>
              <p className="lbl">Tu nombre</p>
              <input className="txt-in" type="text" placeholder="Nombre y apellido" value={name} onChange={e=>setName(e.target.value)}/>
              <div className="instr">
                <p>Para cada afirmación vas a encontrar <strong>distintos formatos de respuesta</strong>. Todos miden lo mismo: qué tan importante es eso para vos, del <strong>1 al 6</strong>.<br/><br/>
                Respondé con lo que <strong>realmente te mueve</strong>, no con lo que creés que debería moverte.</p>
              </div>
              <p className="lbl" style={{marginBottom:12}}>Formatos que vas a encontrar</p>
              <div className="fmt-preview">
                {[
                  {icon:"📊",txt:"Escala numérica"},
                  {icon:"🎯",txt:"Elección directa"},
                  {icon:"🎮",txt:"Slider visual"},
                  {icon:"⚡",txt:"Reacción rápida"},
                ].map(f=>(
                  <div key={f.txt} className="fmt-badge">
                    <div className="fmt-badge-icon">{f.icon}</div>
                    <div className="fmt-badge-txt">{f.txt}</div>
                  </div>
                ))}
              </div>
              <button className="btn" disabled={name.trim().length<2} onClick={()=>{setView("questions");setQ(0);}}>
                Comenzar diagnóstico
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>
              </button>
            </div>
          </div>
        </div>
      )}

      {/* MIDPOINT */}
      {view==="midpoint"&&(
        <MidpointScreen name={name} answered={answered} onContinue={()=>{setView("questions");setQ(MIDPOINT_Q);setAk(x=>x+1);window.scrollTo({top:0,behavior:"smooth"});}}/>
      )}

      {/* QUESTIONS */}
      {view==="questions"&&(
        <div className="wrap">
          <div className="q-scr">
            <div key={ak} className="fup" style={{flex:1,display:"flex",flexDirection:"column"}}>
              <p className="q-eye">
                <span className="q-eye-dot"/>
                Afirmación {q+1} de {total}
              </p>
              <div className="q-wrap">
                <div className="q-num">{String(q+1).padStart(2,"0")}</div>
                <p className="q-txt">{cur.t}</p>
              </div>
              <QuestionBlock question={cur} val={curVal} onPick={pick}/>
              <div className="q-nav">
                <button className="btn-g" onClick={goPrev}>
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                  Anterior
                </button>
                <span className="q-hint">{!curVal?"Respondé para continuar":""}</span>
                <button className="btn-g" onClick={handleNext} style={curVal?{}:{opacity:.3,pointerEvents:"none"}}>
                  {q===MIDPOINT_Q-1?"Continuar →":q<total-1?"Siguiente":"Ver resultados"}
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* RESULTS */}
      {view==="results"&&(
        <div className="wrap">
          <div className="res-scr fup">
            <div className="hero-dark dk">
              <p className="res-eye">Diagnóstico de Anclas de Carrera · Tenkai Consulting</p>
              <h2 className="res-name">{name}</h2>
              <p className="res-sub">{answered} afirmaciones respondidas · Modelo Edgar Schein</p>
            </div>
            <p className="sec-lbl">Perfil de anclas</p>
            <div className="radar-bg dk"><Radar sc={sc}/></div>
            <div style={{marginBottom:36}}>
              <p className="sec-lbl">Ranking · mayor a menor puntaje</p>
              {sc.map((a,i)=>(
                <div key={a.id} className="rank-row">
                  <div className={"rank-n"+(i===0?" top":"")}>{i+1}</div>
                  <div className="rank-name">{a.name}</div>
                  <div className="rank-pill" style={{background:i===0?"var(--tk-grad-h)":a.c+"18",color:i===0?"#fff":a.c,border:i===0?"none":`1px solid ${a.c}44`}}>
                    {a.s>0?a.s+" / 6":"—"}
                  </div>
                </div>
              ))}
            </div>
            <div className="cta-dark dk">
              <h3 className="cta-h">¿Qué significan tus resultados?</h3>
              <p className="cta-p">Descargá este PDF y enviáselo por mail para recibir tu análisis personalizado.</p>
              <div className="cta-acts">
                <button className="btn no-print" onClick={()=>window.print()}>
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>
                  Descargar PDF
                </button>
                <a className="btn-mail no-print" href={"mailto:esteban@tenkai.com.ar?subject="+subj+"&body="+body}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                  Enviar a esteban@tenkai.com.ar
                </a>
                <p className="cta-hint">También podés adjuntar el PDF manualmente</p>
              </div>
            </div>
            <div className="ftr">
              <img src={LOGO} alt="Tenkai Consulting" className="ftr-logo"/>
              <div className="ftr-brand">Tenkai</div>
              <div className="ftr-url">tenkai.com.ar · Coach de Carrera</div>
              <div className="soc-row">
                {SOCIALS.map(s=>(
                  <a key={s.label} href={s.url} target="_blank" rel="noopener noreferrer" className="soc-a">
                    {s.icon}<span>{s.label}</span>
                  </a>
                ))}
              </div>
              <div className="ftr-copy">© 2026 Tenkai Consulting</div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
